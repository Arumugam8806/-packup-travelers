<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="55%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#2a1a15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8c078"/>
      <stop offset="100%" stop-color="#c9a05a"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6e6"/>
      <stop offset="100%" stop-color="#f2dcb3"/>
    </linearGradient>
  </defs>

  <!-- outer ticket-perforated ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#c9a05a" stroke-width="1.4" stroke-dasharray="4 6" opacity="0.55"/>

  <!-- curved sky trail -->
  <path d="M40 128 C 70 108, 95 92, 150 55" fill="none" stroke="#c9a05a" stroke-width="2.4" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.85"/>

  <!-- paper plane -->
  <g transform="translate(96,72) rotate(-32)">
    <path d="M0 0 L46 10 L0 34 L6 14 Z" fill="url(#planeGrad)" stroke="#3e2723" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M0 0 L18 15 L6 14 Z" fill="#d8b985"/>
  </g>

  <!-- road -->
  <path d="M18 150 Q100 118 182 150 L182 168 Q100 138 18 168 Z" fill="#6d4c41"/>
  <path d="M18 159 Q100 128 182 159" fill="none" stroke="#e8c078" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- rail track under the road -->
  <g stroke="#c9a05a" stroke-width="2.2" opacity="0.9">
    <line x1="30" y1="176" x2="170" y2="176"/>
    <line x1="30" y1="184" x2="170" y2="184"/>
    <line x1="42" y1="174" x2="42" y2="186"/>
    <line x1="62" y1="174" x2="62" y2="186"/>
    <line x1="82" y1="174" x2="82" y2="186"/>
    <line x1="102" y1="174" x2="102" y2="186"/>
    <line x1="122" y1="174" x2="122" y2="186"/>
    <line x1="142" y1="174" x2="142" y2="186"/>
    <line x1="162" y1="174" x2="162" y2="186"/>
  </g>

  <!-- bus wheel accents -->
  <circle cx="66" cy="152" r="5" fill="#2a1a15" stroke="#e8c078" stroke-width="1.4"/>
  <circle cx="134" cy="152" r="5" fill="#2a1a15" stroke="#e8c078" stroke-width="1.4"/>
</svg>
